name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/liudinghao27-boop/kehuojingling

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 诊断：先在 runner (glibc) 上直接构建，失败时把日志尾部写入注解（公开 API 可见）
      - name: Diagnose build on runner
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Runner build probe
        run: |
          npm ci
          npx prisma generate
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            grep -E "Can't resolve|Module not found|error TS|Failed to compile" build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
