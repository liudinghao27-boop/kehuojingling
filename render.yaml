# Render Blueprint —— 获客精灵唯一部署描述
# 使用方式：Render Dashboard → New → Blueprint → 选择本仓库
# sync: false 的密钥需在 Blueprint 应用后于 Dashboard 手动填入（值见部署文档）
services:
  - type: web
    name: kehuojingling
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    # 启动前先应用数据库迁移，保证 schema 与代码一致
    startCommand: npx prisma migrate deploy && npx next start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://kehuojingling.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kehuojingling-db
          property: connectionString
      # Bull 队列（回复/私信/抓取/账号维护定时任务）依赖 Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: kehuojingling-redis
          property: connectionString
      # 以下为敏感配置，Blueprint 应用后在 Dashboard 填入：
      - key: OPENAI_API_KEY          # DeepSeek 等兼容 OpenAI SDK 的 key
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: PLATFORM_CREDENTIALS_ENCRYPTION_KEY   # base64 32 字节，Cookie/凭证加密
        sync: false
      - key: AI_API_KEY_ENCRYPTION_KEY             # base64 32 字节，用户 AI key 加密
        sync: false
      - key: SCRAPER_API_URL         # 抓取服务地址（独立部署后填入）
        sync: false
      - key: SENDER_PROVIDER         # real / mock，试用初期建议 mock
        sync: false

  - type: redis
    name: kehuojingling-redis
    plan: free
    # Bull 官方要求 noeviction，避免队列数据被逐出
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: kehuojingling-db
    databaseName: kehuojingling
    user: kehuojingling
    plan: free
